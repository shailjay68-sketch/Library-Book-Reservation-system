<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <h2>🔐 Library Portal Login</h2>
        <p>Please enter your credentials to access the system</p>
        
        <form id="login-form">
            <label for="username">Username / Student ID:</label>
            <input type="text" id="username" placeholder="Enter ID (e.g. admin or student)" required>

            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Enter password" required>

            <button type="submit">Login to Portal</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
